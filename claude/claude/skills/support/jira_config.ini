# =============================================================================
# jira_config.ini — JIRA WBS Creator Configuration
# =============================================================================
# Copy this file to jira_config.ini and fill in your credentials.
# IMPORTANT: jira_config.ini is gitignored — never commit it.
# =============================================================================

[JIRA]

# Your Atlassian Cloud base URL (no trailing slash)
server = https://bjit.atlassian.net

# Email address tied to your Atlassian account
email = pavel.parvej@bjitgroup.com

# JIRA API Token — generate at: https://id.atlassian.com/manage-profile/security/api-tokens
api_token = ATATT3xFfGF0a5LMYj3el1HDmXK6S8nGfqHnkZETYpLYhgS19QybMOJfhQna_RvHvdfmsvpo_nuIQxEetXp-zTg2roMvx15kFeGIpgbU3n1S7LNVdwmbgz8xgvz9lwg0kOJKf_dbY9TEFKmgxPvu2y6CT6nye8X_XW5hTzVGQx26fWgZxIc2UkM=15D9469A

# JIRA project key (must already exist in JIRA, e.g. CR5, P001, PROJ)
project = P1709

# Story points custom field name for your JIRA instance
# Common values: customfield_10016 (Cloud default), customfield_10028, story_points (Server)
story_points_field = customfield_10016

# Task Estimation Time custom field ID (optional)
# This field stores the estimated hours for each sub-task as a number
# Use your Jira field ID for "Task Estimation Time" (leave blank to skip)
task_estimation_time_field = customfield_10806

# Daily Worklog Logger — custom field IDs (used by [Worklog])
# AI Contribution: select field, options are "0".."100" (plain numbers)
# %Done: select field, options are "0%".."100%" in 10% steps
ai_contribution_field = customfield_10193
done_pct_field = customfield_10101


[BEHAVIOUR]

# Delay between API calls (seconds) to avoid rate limits
subtask_delay = 0.2
story_delay = 0.3

# Issue type names — must match exactly what your JIRA project uses
# Check: JIRA Project Settings → Issue Types
story_type = Story
subtask_type = Sub-task


[LABELS]

# Comma-separated labels applied to all created issues (leave empty for none)
# The project key is always added automatically
extra_labels = wbs-import


[CODING_CONVENTION]

# Add a coding-convention checklist section to each Story description.
# Set to false to disable this section.
enabled = true

# Optional custom checklist items.
# Use one item per indented line. If empty, built-in defaults are used.
checklist_items =
	No changes in src/Eccube (use app/Customize, app/Plugin, app/config, app/template)
	No Doctrine migrations; use manual SQL scripts for schema changes
	Controllers stay thin and delegate business logic to services
	Use constructor dependency injection for services
	Use parameterized queries; never concatenate SQL strings
	Validate input at system boundaries
	Use transactions for multi-step write operations
	Run cache clear and validation commands for touched modules


[PR_REVIEW]

# Automatically add a PR Review sub-task to each Story.
# Set to false to disable automatic sub-task generation.
enabled = true

# Sub-task summary/title
summary = PR Review & Code Quality

# Sub-task description (brief)
description = Code review, testing coverage verification, static analysis, and documentation validation.

# Estimated hours for PR Review (float, default: 8)
estimate_hours = 8
