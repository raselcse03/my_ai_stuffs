# JIRA project key (must already exist in JIRA)
project = P1709

# Story points custom field name for your JIRA instance
# Common: customfield_10016 (Cloud), customfield_10028, story_points (Server)
story_points_field = customfield_10016


[WBS]

# Default WBS markdown file path
# Can be overridden with: bash run.sh --wbs <other-file.md>
wbs_file = wbs-cr4-phase3-store-pickup-management2.md

[BEHAVIOUR]

# Delay between API calls (seconds) to avoid rate limits
subtask_delay = 0.2
story_delay = 0.3

# Issue type names (change if your project uses different names)
story_type = Story
subtask_type = Sub-task


[LABELS]

# Comma-separated labels applied to all created issues
# The project key is always added automatically
extra_labels = wbs-import
